<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FindMe | Реєстрація</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #ee9ca7 0%, #ffdde1 100%);
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="flex items-center justify-center p-6">
<div class="glass w-full max-w-md p-8 rounded-3xl shadow-2xl text-gray-800">
    <div class="text-center mb-8">
        <h1 class="text-4xl font-extrabold text-indigo-700 mb-2">Приєднуйся</h1>
        <p class="text-gray-600">Створи свій акаунт FindMe</p>
    </div>

    <form id="registerForm" class="space-y-5">
        <div>
            <label class="block text-sm font-semibold mb-1 ml-1">Ім'я користувача</label>
            <input type="text" name="username" required
                   class="w-full px-4 py-3 rounded-xl bg-white/50 border border-gray-200 focus:ring-2 focus:ring-indigo-400 outline-none transition-all">
        </div>

        <div>
            <label class="block text-sm font-semibold mb-1 ml-1">Email</label>
            <input type="email" name="email" required
                   class="w-full px-4 py-3 rounded-xl bg-white/50 border border-gray-200 focus:ring-2 focus:ring-indigo-400 outline-none transition-all"
                   placeholder="example@mail.com">
        </div>

        <div>
            <label class="block text-sm font-semibold mb-1 ml-1">Пароль</label>
            <input type="password" name="password" required
                   class="w-full px-4 py-3 rounded-xl bg-white/50 border border-gray-200 focus:ring-2 focus:ring-indigo-400 outline-none transition-all">
        </div>

        <button type="submit"
                class="w-full py-3 px-4 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition-all transform hover:scale-[1.02] shadow-lg">
            Створити акаунт
        </button>
    </form>

    <div class="mt-6 text-center text-sm">
        <span class="text-gray-600">Вже є акаунт?</span>
        <a href="/login" class="text-indigo-700 font-bold hover:underline ml-1">Увійти</a>
    </div>
</div>

<script>
    document.getElementById('registerForm').onsubmit = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());

        const response = await fetch('/auth/sign-up', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (response.ok) {
            alert('Реєстрація успішна!');
            window.location.href = '/login';
        } else {
            alert('Помилка реєстрації.');
        }
    };
</script>
</body>
</html>
