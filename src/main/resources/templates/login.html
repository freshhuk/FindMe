<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FindMe | Вхід</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .glass {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="flex items-center justify-center p-6">
<div class="glass w-full max-auto max-w-md p-8 rounded-3xl shadow-2xl text-white">
  <div class="text-center mb-10">
    <h1 class="text-4xl font-bold mb-2">FindMe</h1>
    <p class="text-blue-100">З поверненням!</p>
  </div>

  <form id="loginForm" class="space-y-6">
    <div>
      <label class="block text-sm font-medium mb-2">Ім'я користувача</label>
      <input type="text" name="username" required
             class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 focus:border-white focus:bg-white/20 outline-none transition-all placeholder:text-blue-200"
             placeholder="Введіть ім'я користувача">
    </div>

    <div>
      <label class="block text-sm font-medium mb-2">Пароль</label>
      <input type="password" name="password" required
             class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 focus:border-white focus:bg-white/20 outline-none transition-all placeholder:text-blue-200"
             placeholder="••••••••">
    </div>

    <button type="submit"
            class="w-full py-3 px-4 bg-white text-indigo-600 font-bold rounded-xl hover:bg-indigo-50 transition-colors shadow-lg shadow-indigo-900/20">
      Увійти
    </button>
  </form>

  <div class="mt-8 text-center text-sm">
    <span class="text-blue-100">Немає акаунту?</span>
    <a href="/register" class="font-bold hover:underline ml-1">Зареєструватися</a>
  </div>
</div>

<script>
  document.getElementById('loginForm').onsubmit = async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const data = Object.fromEntries(formData.entries());

    const response = await fetch('/auth/sign-in', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    if (response.ok) {
      const result = await response.json();
      localStorage.setItem('token', result.token);
      window.location.href = '/index';
    } else {
      alert('Помилка входу. Перевірте дані.');
    }
  };
</script>
</body>
</html>
