<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>FindMe | AI Сканер</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: white;
            overflow: hidden;
        }

        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .scanner-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: #4f46e5;
            box-shadow: 0 0 10px #4f46e5, 0 0 20px #818cf8;
            animation: scan 2s linear infinite;
            display: none;
            z-index: 10;
        }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
            animation: float 10s infinite ease-in-out;
        }
        .blob-1 { top: -10%; left: -10%; width: 500px; height: 500px; background: #4f46e5; animation-delay: 0s; }
        .blob-2 { bottom: -10%; right: -10%; width: 400px; height: 400px; background: #be123c; animation-delay: 5s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -50px); }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen relative">

<div class="blob blob-1 rounded-full"></div>
<div class="blob blob-2 rounded-full"></div>

<div class="glass w-full max-w-md p-8 rounded-3xl relative z-10 transition-all duration-500" id="main-card">

    <div class="flex justify-between items-center mb-6">
        <div class="flex items-center space-x-2">
            <div class="w-3 h-3 bg-indigo-500 rounded-full animate-pulse"></div>
            <h1 class="text-xl font-bold tracking-wider">FINDME <span class="text-indigo-400 font-light">AI</span></h1>
        </div>
        <button onclick="logout()" class="text-xs text-white/50 hover:text-white transition-colors uppercase tracking-widest font-semibold">Вийти</button>
    </div>

    <form id="uploadForm" class="space-y-6">

        <div id="drop-zone-container" class="relative group">
            <div id="drop-zone" class="border-2 border-dashed border-white/10 bg-white/5 rounded-2xl h-64 flex flex-col items-center justify-center text-center hover:border-indigo-500/50 hover:bg-white/10 transition-all cursor-pointer overflow-hidden">
                <svg class="w-12 h-12 text-indigo-400 mb-3 group-hover:scale-110 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <p class="text-sm font-medium text-white/80">Натисніть або перетягніть фото</p>
                <p class="text-xs text-white/40 mt-1">JPG, PNG</p>
            </div>

            <div id="preview-container" class="hidden relative h-64 rounded-2xl overflow-hidden border border-white/10 bg-black/50">
                <img id="image-preview" class="w-full h-full object-contain opacity-80" src="" alt="Preview">
                <div id="scanner" class="scanner-line"></div>
                <button type="button" id="remove-btn" class="absolute top-2 right-2 bg-black/50 hover:bg-red-500/80 text-white p-1 rounded-full backdrop-blur-md transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <input type="file" id="file-input" name="image" accept="image/*" class="hidden">
        </div>

        <div class="space-y-4">
            <button type="submit" id="submit-btn" class="w-full py-4 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 rounded-xl font-bold text-lg shadow-lg shadow-indigo-900/30 transition-all transform hover:scale-[1.02] disabled:opacity-50 disabled:cursor-not-allowed">
                Розпочати аналіз
            </button>

            <div id="result-box" class="hidden transition-all duration-500 transform translate-y-4 opacity-0">
                <div class="bg-white/5 border border-white/10 rounded-xl p-4 flex justify-between items-center backdrop-blur-md">
                    <div class="text-left">
                        <p class="text-xs text-indigo-300 uppercase tracking-wider font-semibold">Знайдено об'єктів</p>
                        <p class="text-xs text-white/40">OpenCV Algorithm</p>
                    </div>
                    <div class="text-right">
                        <span id="count" class="text-4xl font-black text-white transparent bg-clip-text bg-gradient-to-br from-white to-indigo-200">0</span>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<script>
    const token = localStorage.getItem('token');
    if (!token && window.location.pathname !== '/login') {
        window.location.href = '/login';
    }

    function logout() {
        localStorage.removeItem('token');
        window.location.href = '/login';
    }

    const dropZone = document.getElementById('drop-zone');
    const previewContainer = document.getElementById('preview-container');
    const imagePreview = document.getElementById('image-preview');
    const fileInput = document.getElementById('file-input');
    const removeBtn = document.getElementById('remove-btn');
    const scanner = document.getElementById('scanner');
    const submitBtn = document.getElementById('submit-btn');
    const resultBox = document.getElementById('result-box');
    const resultCount = document.getElementById('count');

    dropZone.onclick = () => fileInput.click();

    fileInput.onchange = (e) => handleFile(fileInput.files[0]);

    ['dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
    }

    dropZone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const file = dt.files[0];
        fileInput.files = dt.files;
        handleFile(file);
    });

    function handleFile(file) {
        if (!file || !file.type.startsWith('image/')) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            imagePreview.src = e.target.result;
            dropZone.classList.add('hidden');
            previewContainer.classList.remove('hidden');
            resultBox.classList.add('hidden', 'opacity-0', 'translate-y-4');
        }
        reader.readAsDataURL(file);
    }

    removeBtn.onclick = () => {
        fileInput.value = '';
        previewContainer.classList.add('hidden');
        dropZone.classList.remove('hidden');
        resultBox.classList.add('hidden');
        scanner.style.display = 'none';
    }

    document.getElementById('uploadForm').onsubmit = async (e) => {
        e.preventDefault();

        if (!fileInput.files[0]) {
            document.getElementById('main-card').classList.add('animate-pulse');
            setTimeout(() => document.getElementById('main-card').classList.remove('animate-pulse'), 500);
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Аналіз...
            `;

        scanner.style.display = 'block';

        const formData = new FormData();
        formData.append('image', fileInput.files[0]);

        try {
            await new Promise(r => setTimeout(r, 1000));

            const response = await fetch('/api/getSilhouette', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token },
                body: formData
            });

            if (response.ok) {
                const count = await response.text();

                resultCount.innerText = count;
                resultBox.classList.remove('hidden');
                setTimeout(() => {
                    resultBox.classList.remove('opacity-0', 'translate-y-4');
                }, 50);

            } else if (response.status === 403) {
                alert("Сесія минула.");
                logout();
            } else {
                alert("Помилка сервера");
            }
        } catch (err) {
            console.error(err);
            alert("Помилка з'єднання");
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "Розпочати аналіз";
            scanner.style.display = 'none';
        }
    };
</script>
</body>
</html>
